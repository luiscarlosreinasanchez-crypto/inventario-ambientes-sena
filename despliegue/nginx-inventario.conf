# /etc/nginx/sites-available/inventario.luiscarlosreina.com
# Archivo NUEVO: no modifica la configuración de firmas.luiscarlosreina.com
server {
    listen 80;
    server_name inventario.luiscarlosreina.com;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# El certificado HTTPS se agrega luego con: certbot --nginx -d inventario.luiscarlosreina.com
